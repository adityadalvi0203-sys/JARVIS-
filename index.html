<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020b18">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>JARVIS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <div class="title">J.A.R.V.I.S</div>
    <button id="langBtn" type="button" aria-label="Change language">EN</button>
  </header>

  <div id="orbWrap">
    <div id="orb" class="idle" aria-hidden="true">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
      <div class="core"></div>
    </div>
  </div>
  <div id="status">Standing by</div>

  <main id="chat" aria-live="polite"></main>

  <footer>
    <input id="textInput" type="text" placeholder="Type a message" autocomplete="off" enterkeyhint="send">
    <button id="sendBtn" type="button" aria-label="Send">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 20l18-8L3 4v6l12 2-12 2z" fill="currentColor"/></svg>
    </button>
    <button id="micBtn" type="button" aria-label="Speak">
      <svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V22h2v-3.1A7 7 0 0 0 19 12z" fill="currentColor"/></svg>
    </button>
  </footer>
</div>
<script src="app.js?v=2"></script>
</body>
</html>
